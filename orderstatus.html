<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Order Status | Antant Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light only;
            --accent-glow: #e11d48;
            --accent-green: #22c55e;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --bg: #0c7787;
            --card-bg: #fffefb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px 48px;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            color: var(--text-main);
        }
        .card {
            max-width: 420px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
        }
        .shop-head { text-align: center; margin-bottom: 18px; }
        .shop-head h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-glow);
            letter-spacing: 0.5px;
        }
        .shop-head p { margin: 2px 0 0; font-size: 0.8rem; color: var(--text-sub); font-style: italic; }
        .meta { text-align: center; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 18px; }
        .meta strong { color: var(--text-main); }
        .product-block { margin-bottom: 20px; }
        .product-name { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
        .stage-track { display: flex; flex-direction: column; gap: 0; }
        .stage {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; font-size: 0.85rem; color: var(--text-sub);
        }
        .stage-dot {
            width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
            border: 2px solid #d8d8d8; background: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .stage.done { color: var(--text-main); font-weight: 600; }
        .stage.done .stage-dot { background: var(--accent-green); border-color: var(--accent-green); }
        .stage.current { color: var(--accent-glow); font-weight: 700; }
        .stage.current .stage-dot { background: var(--accent-glow); border-color: var(--accent-glow); }
        .stage.done .stage-dot::after { content: '✓'; color: #fff; font-size: 11px; }
        .foot { text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-sub); }
        .status-msg { text-align: center; color: #fff; font-family: 'Outfit', sans-serif; margin-top: 60px; padding: 0 20px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="status-msg">Loading order status…</div>
    </div>

    <script>
        const RENDER_BACKEND_URL = 'https://aantaat-webapp.onrender.com';
        const orderId = new URLSearchParams(window.location.search).get('id');
        const root = document.getElementById('root');
        const STAGE_LABELS = ["Unassigned", "Material Assigned", "Printing & Dye", "Stitching & Tailoring", "Finished Outfit"];

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function renderOrder(order) {
            document.title = `Order ${order.order_id} | Antant Boutique`;
            const products = order.Product || [];
            const status = order.Status || {};

            const blocks = products.map(prod => {
                const stageNum = Number(status[prod] || 1);
                const stages = STAGE_LABELS.map((label, idx) => {
                    const n = idx + 1;
                    const cls = n < stageNum ? 'done' : (n === stageNum ? 'current' : '');
                    return `<div class="stage ${cls}"><span class="stage-dot"></span>${escapeHtml(label)}</div>`;
                }).join('');
                return `
                    <div class="product-block">
                        <div class="product-name">${escapeHtml(prod)}</div>
                        <div class="stage-track">${stages}</div>
                    </div>`;
            }).join('');

            root.innerHTML = `
                <div class="card">
                    <div class="shop-head">
                        <h1>ANTANT BOUTIQUE</h1>
                        <p>fits you inside</p>
                    </div>
                    <div class="meta">
                        Order: <strong>${escapeHtml(order.order_id)}</strong><br>
                        ${order.custName ? `For: <strong>${escapeHtml(order.custName)}</strong>` : ''}
                    </div>
                    ${blocks || '<p style="text-align:center;color:var(--text-sub);">No items on this order.</p>'}
                    <div class="foot">We'll keep this updated as your order progresses.</div>
                </div>
            `;
        }

        async function load() {
            if (!orderId) {
                root.innerHTML = '<div class="status-msg">No order specified.</div>';
                return;
            }
            try {
                const res = await fetch(`${RENDER_BACKEND_URL}/api/orderstatus/${encodeURIComponent(orderId)}`);
                const data = await res.json();
                if (data.status === 'success') {
                    renderOrder(data);
                } else {
                    root.innerHTML = `<div class="status-msg">${escapeHtml(data.message || 'Order not found.')}</div>`;
                }
            } catch (e) {
                console.error(e);
                root.innerHTML = '<div class="status-msg">Could not load this order right now. Please try again shortly.</div>';
            }
        }

        load();
    </script>
</body>
</html>
